name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Android platform 35 and build-tools 35.0.0
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check and tests
        run: |
          npm run typecheck
          npm test

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=vishaljarvis" >> "$GITHUB_ENV"
            echo "Using the repository signing key (updates install over older builds)."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. A temporary key is used, so uninstall the old app before installing this build."
          fi

      - name: Bump versionCode for this build
        run: node scripts/bump-version.mjs

      - name: Build APK
        run: bash scripts/build-android.sh

      - name: Read version
        id: version
        run: |
          echo "name=$(sed -n 's/.*android:versionName="\([0-9.]*\)".*/\1/p' android/app/src/main/AndroidManifest.xml | head -1)" >> "$GITHUB_OUTPUT"
          echo "code=$(sed -n 's/.*android:versionCode="\([0-9]*\)".*/\1/p' android/app/src/main/AndroidManifest.xml | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Vishal-Jarvis-${{ steps.version.outputs.name }}-APK
          path: artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.name }}-build${{ github.run_number }}"
          cd artifacts/android
          for apk in *.apk; do mv "$apk" "Vishal-Jarvis-${{ steps.version.outputs.name }}-build${{ github.run_number }}.apk"; done
          gh release create "$TAG" ./*.apk \
            --title "Vishal Jarvis ${{ steps.version.outputs.name }} (build ${{ github.run_number }})" \
            --notes "Automatic APK build from commit ${GITHUB_SHA::7} (versionCode ${{ steps.version.outputs.code }}). Download the .apk below and install it on your Android phone." \
            --latest
