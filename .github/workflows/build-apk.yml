name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Android platform 35 and build-tools 35.0.0
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check and tests
        run: |
          npm run typecheck
          npm test

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            # A keystore that does not open is worse than a missing one: signing would fail after
            # the whole build. Check it here, before anything is compiled.
            keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" > /dev/null
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=vishaljarvis" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the repository key, so this build installs over the older ones."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64/ANDROID_KEYSTORE_PASSWORD secret: this APK is signed with a temporary key, so the previous version has to be uninstalled first."
          fi

      - name: Bump versionCode for this build
        run: node scripts/bump-version.mjs

      - name: Build APK
        run: bash scripts/build-android.sh

      - name: Read version
        id: version
        run: |
          echo "name=$(sed -n 's/.*android:versionName="\([0-9.]*\)".*/\1/p' android/app/src/main/AndroidManifest.xml | head -1)" >> "$GITHUB_OUTPUT"
          echo "code=$(sed -n 's/.*android:versionCode="\([0-9]*\)".*/\1/p' android/app/src/main/AndroidManifest.xml | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Vishal-Jarvis-${{ steps.version.outputs.name }}-APK
          path: artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        # Publish for main and for the arena working branch, so a verified download link exists
        # for every build the user is asked to install. Pull requests never publish.
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/facfb0c6-vishal-jarvis-ai')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.name }}-build${{ github.run_number }}"
          cd artifacts/android
          for apk in *.apk; do mv "$apk" "Vishal-Jarvis-${{ steps.version.outputs.name }}-build${{ github.run_number }}.apk"; done
          sha256sum ./*.apk > SHA256SUMS.txt
          # One line on purpose: a blank line inside a YAML block scalar ends the scalar.
          NOTES="Build ${GITHUB_SHA::7}, versionCode ${{ steps.version.outputs.code }}. Install: tap the .apk and allow \"Install unknown apps\" when Android asks. If Android says \"App not installed\", uninstall the older Vishal Jarvis first. If the app closes right after opening, use Settings - Crash report inside the app to see the exact error."
          gh release create "$TAG" ./*.apk SHA256SUMS.txt \
            --title "Vishal Jarvis ${{ steps.version.outputs.name }} (build ${{ github.run_number }})" \
            --notes "$NOTES" \
            --latest
