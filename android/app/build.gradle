plugins { id 'com.android.application' }

android {
    namespace 'com.myraa.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.myraa.mobile'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '2.0.0'
    }
    signingConfigs {
        debug {
            storeFile file('../local-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (System.getenv('ANDROID_SIGNING_STORE_FILE')) {
                storeFile file(System.getenv('ANDROID_SIGNING_STORE_FILE'))
                storePassword System.getenv('ANDROID_SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_SIGNING_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_SIGNING_STORE_FILE')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
